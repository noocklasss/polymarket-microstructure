[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pmlab"
version = "0.1.0"
description = "Order-book recording and look-ahead-free research tools for Polymarket short-horizon crypto Up/Down markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "aiohttp>=3.9",
    "requests>=2.31",
    "tzdata>=2025.1",
    "duckdb>=1.1",
    "pyarrow>=15",
]

[project.scripts]
pmlab = "pmlab.cli:main"

[project.optional-dependencies]
research = ["matplotlib>=3.8", "jupyter>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/pmlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
