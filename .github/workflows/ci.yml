name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      # Actions are pinned to a full commit SHA (the tag is in the comment), so a moved tag cannot change what CI runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (including the bundled sample reproducing the study)
        run: pytest -q --cov=pmlab --cov-report=term

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t pmlab .
      - name: Smoke test
        run: |
          docker run --rm pmlab families | tee families.txt
          test "$(wc -l < families.txt)" -eq 16
          docker run --rm --entrypoint python pmlab -c "import pmlab.backtest.runner, pmlab.data.loaders, pmlab.ingestion.recorder"
          test "$(docker run --rm --entrypoint id pmlab -u)" != "0"
